<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PageForge – Free PDF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f6f5f2;
      --card: #fff;
      --tx: #1d1d1f;
      --mut: #6b6b70;
      --bd: #e3e1dc;
      --ac: #e5322d;
      --ac2: #fde8e7
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #161617;
        --card: #212123;
        --tx: #f2f2f3;
        --mut: #a0a0a6;
        --bd: #35353a;
        --ac: #ff5a54;
        --ac2: #3a2221
      }
    }

    :root[data-theme="dark"] {
      --bg: #161617;
      --card: #212123;
      --tx: #f2f2f3;
      --mut: #a0a0a6;
      --bd: #35353a;
      --ac: #ff5a54;
      --ac2: #3a2221
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--bd);
      background: var(--card)
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      cursor: pointer
    }

    .logo b {
      color: var(--ac)
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 60px
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      text-align: center;
      margin: 20px 0 6px
    }

    .sub {
      text-align: center;
      color: var(--mut);
      margin: 0 0 28px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px
    }

    .tool {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: .15s
    }

    .tool:hover {
      transform: translateY(-3px);
      border-color: var(--ac)
    }

    .tool .i {
      font-size: 30px
    }

    .tool h3 {
      margin: 8px 0 4px;
      font-size: 17px
    }

    .tool p {
      margin: 0;
      color: var(--mut);
      font-size: 14px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 22px;
      max-width: 680px;
      margin: 0 auto
    }

    .back {
      background: none;
      border: 0;
      color: var(--mut);
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 10px;
      padding: 0
    }

    .drop {
      border: 2px dashed var(--bd);
      border-radius: 14px;
      padding: 34px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--mut)
    }

    .drop.over,
    .drop:hover {
      border-color: var(--ac);
      background: var(--ac2)
    }

    .files {
      list-style: none;
      padding: 0;
      margin: 14px 0
    }

    .files li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 14px
    }

    .files .n {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .files button {
      border: 0;
      background: none;
      cursor: pointer;
      color: var(--mut);
      font-size: 16px
    }

    .opts {
      display: grid;
      gap: 10px;
      margin: 14px 0
    }

    .opts label {
      display: grid;
      gap: 4px;
      font-size: 14px;
      color: var(--mut)
    }

    input[type=text],
    input[type=number],
    select {
      padding: 9px 10px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
      font: inherit;
      width: 100%
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--ac);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer
    }

    .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--ac2);
      font-size: 14px
    }

    .ok {
      border: 1px solid var(--ac)
    }

    .tb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      align-items: center
    }

    .tb button {
      padding: 7px 10px;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px
    }

    .tb button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .stage {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--bg);
      padding: 10px
    }

    #cv {
      display: block;
      background: #fff
    }

    #ov {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair
    }

    .r,
    .tx,
    .ib {
      position: absolute
    }

    .r,
    .tx {
      pointer-events: none
    }

    .tx {
      white-space: pre;
      line-height: 1
    }

    .ib {
      cursor: text;
      outline: 1px dashed rgba(90, 120, 255, .45)
    }

    .ib:hover {
      outline-color: var(--ac);
      background: rgba(229, 50, 45, .12)
    }

    .ti {
      position: absolute;
      border: 1px solid var(--ac);
      background: #fff;
      padding: 0;
      margin: 0;
      line-height: 1;
      outline: none
    }

    .rs {
      max-height: 150px;
      overflow: auto;
      font-size: 14px;
      color: var(--mut)
    }

    .rr {
      padding: 6px 8px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      margin: 4px 0;
      cursor: pointer;
      color: var(--tx)
    }

    .rr:hover {
      border-color: var(--ac)
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-left: auto
    }

    .tabs button {
      padding: 8px 14px;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px
    }

    .tabs button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    #iov {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair
    }

    .bx {
      position: absolute;
      z-index: 5;
      border: 2px dashed var(--ac);
      box-sizing: border-box
    }

    .bx textarea {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      padding: 0;
      margin: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      display: block
    }

    .bh {
      position: absolute;
      left: -2px;
      bottom: 100%;
      display: flex;
      gap: 4px;
      align-items: center;
      background: var(--ac);
      color: #fff;
      border-radius: 6px 6px 0 0;
      padding: 2px 6px;
      font-size: 12px;
      white-space: nowrap
    }

    .lo .bh {
      bottom: auto;
      top: 100%;
      border-radius: 0 0 6px 6px
    }

    .mv {
      cursor: move;
      touch-action: none;
      padding: 3px 8px;
      user-select: none;
      font-weight: 700
    }

    .bh button {
      border: 0;
      background: rgba(255, 255, 255, .28);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px 9px;
      font-size: 13px
    }

    .rz {
      position: absolute;
      right: -8px;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: var(--ac);
      border-radius: 4px;
      cursor: nwse-resize;
      touch-action: none
    }

    .bx.pl {
      border: 1px dashed var(--ac)
    }

    .bx.pl textarea {
      white-space: pre
    }

    svg.pa {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }
  </style>
</head>

<body>
  <header><span class="logo" onclick="home()">Page<b>Forge</b></span>
    <nav class="tabs"><button id="t_pdf" class="on" onclick="setSec('pdf')">📄 PDF Tools</button><button id="t_img"
        onclick="setSec('img')">🖼️ Image Tools</button></nav>
  </header>
  <main id="app"></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const { PDFDocument, StandardFonts, rgb, degrees } = window.PDFLib;

    const $ = s => document.querySelector(s);

    function parse(s, n) { if (!s.trim()) return [...Array(n).keys()]; const o = []; s.split(",").forEach(p => { const [a, b] = p.split("-").map(x => parseInt(x)); if (isNaN(a)) return; for (let i = a; i <= (isNaN(b) ? a : b); i++)if (i >= 1 && i <= n && !o.includes(i - 1)) o.push(i - 1) }); if (!o.length) throw Error("No valid pages in range."); return o }
    async function render(f, scale, q) {

        const pg = await pdf.getPage(i), v = pg.getViewport({ scale }), c = document.createElement("canvas"); c.width = v.width; c.height = v.height;
        await pg.render({ canvasContext: c.getContext("2d"), viewport: v }).promise; const b = await new Promise(r => c.toBlob(r, "image/jpeg", q)); out.push({ b, w: v.width / scale, h: v.height / scale })
      } return out
    }
    const sel = (id, l, o) => `<label>${l}<select id="${id}">${o.map(x => `<option value="${x[0]}">${x[1]}</option>`).join("")}</select></label>`;
    const txt = (id, l, v = "", p = "") => `<label>${l}<input type="text" id="${id}" value="${v}" placeholder="${p}"></label>`;
    const v = id => $("#" + id).value;
    let TOOLS = {
      merge: { n: "Merge PDF", i: "🧩", d: "Combine PDFs in any order", acc: ".pdf", multi: 1, min: 2, async run(fs) { const o = await PDFDocument.create(); for (const f of fs) { const s = await load(f); (await o.copyPages(s, s.getPageIndices())).forEach(p => o.addPage(p)) } return ["merged.pdf", await o.save()] } },
      split: {
        n: "Split PDF", i: "✂️", d: "Extract pages or split every page", acc: ".pdf", opts: txt("rg", "Pages to extract", "", "e.g. 1-3,5 (blank = all)") + sel("mode", "Output", [["one", "One PDF with these pages"], ["each", "Separate PDF per page (ZIP)"]]), async run(fs) {
          const s = await load(fs[0]), idx = parse(v("rg"), s.getPageCount());
          if (v("mode") == "one") { const o = await PDFDocument.create(); (await o.copyPages(s, idx)).forEach(p => o.addPage(p)); return ["split.pdf", await o.save()] }
          const z = new JSZip(); for (const i of idx) { const o = await PDFDocument.create(); o.addPage((await o.copyPages(s, [i]))[0]); z.file(`page-${i + 1}.pdf`, await o.save()) } return ["pages.zip", await z.generateAsync({ type: "uint8array" })]
        }
      },
      remove: { n: "Remove Pages", i: "🗑️", d: "Delete unwanted pages", acc: ".pdf", opts: txt("rg", "Pages to delete", "", "e.g. 2,4-6"), async run(fs) { const s = await load(fs[0]); parse(v("rg"), s.getPageCount()).sort((a, b) => b - a).forEach(i => s.removePage(i)); return ["removed.pdf", await s.save()] } },
      rotate: { n: "Rotate PDF", i: "🔄", d: "Rotate all or selected pages", acc: ".pdf", opts: sel("ang", "Rotate by", [[90, "90° clockwise"], [180, "180°"], [270, "90° counter-clockwise"]]) + txt("rg", "Pages", "", "blank = all pages"), async run(fs) { const s = await load(fs[0]), P = s.getPages(); parse(v("rg"), P.length).forEach(i => P[i].setRotation(degrees((P[i].getRotation().angle + +v("ang")) % 360))); return ["rotated.pdf", await s.save()] } },
      numbers: {
        n: "Page Numbers", i: "🔢", d: "Add page numbers to every page", acc: ".pdf", opts: sel("pos", "Position", [["bc", "Bottom center"], ["br", "Bottom right"], ["bl", "Bottom left"], ["tc", "Top center"]]) + `<label>Start at<input type="number" id="st" value="1"></label>`, async run(fs) {
          const s = await load(fs[0]), f = await s.embedFont(StandardFonts.Helvetica);
          s.getPages().forEach((p, i) => { const { width: w, height: h } = p.getSize(), t = String(i + +v("st")), tw = f.widthOfTextAtSize(t, 12), q = v("pos"); const x = q[1] == "c" ? (w - tw) / 2 : q[1] == "r" ? w - tw - 30 : 30, y = q[0] == "b" ? 24 : h - 30; p.drawText(t, { x, y, size: 12, font: f, color: rgb(.2, .2, .2) }) }); return ["numbered.pdf", await s.save()]
        }
      },
      mark: {
        n: "Watermark", i: "💧", d: "Stamp text across every page", acc: ".pdf", opts: txt("wm", "Watermark text", "CONFIDENTIAL") + `<label>Opacity (0.1 – 1)<input type="number" id="op" value="0.25" step="0.05" min="0.1" max="1"></label>`, async run(fs) {
          const s = await load(fs[0]), f = await s.embedFont(StandardFonts.HelveticaBold), t = v("wm");
          s.getPages().forEach(p => { const { width: w, height: h } = p.getSize(), sz = Math.min(w, h) / (t.length * .45 + 2) * 1.4, tw = f.widthOfTextAtSize(t, sz), a = Math.PI / 4; p.drawText(t, { x: w / 2 - Math.cos(a) * tw / 2, y: h / 2 - Math.sin(a) * tw / 2, size: sz, font: f, color: rgb(.5, .5, .5), opacity: +v("op"), rotate: degrees(45) }) }); return ["watermarked.pdf", await s.save()]
        }
      },
      img: {
        n: "Images to PDF", i: "🖼️", d: "Turn JPG/PNG/WebP into one PDF", acc: "image/*", multi: 1, opts: sel("fit", "Page size", [["img", "Same as image"], ["a4", "A4 (fit image)"]]), async run(fs) {
          const o = await PDFDocument.create();
          for (const f of fs) {
            const bm = await createImageBitmap(f), c = document.createElement("canvas"); c.width = bm.width; c.height = bm.height; c.getContext("2d").drawImage(bm, 0, 0);
            const im = await o.embedJpg(await (await new Promise(r => c.toBlob(r, "image/jpeg", .92))).arrayBuffer());
            if (v("fit") == "img") o.addPage([bm.width, bm.height]).drawImage(im, { x: 0, y: 0, width: bm.width, height: bm.height });
            else { const p = o.addPage([595, 842]), k = Math.min(555 / bm.width, 802 / bm.height), w = bm.width * k, h = bm.height * k; p.drawImage(im, { x: (595 - w) / 2, y: (842 - h) / 2, width: w, height: h }) }
          } return ["images.pdf", await o.save()]
        }
      },
      tojpg: { n: "PDF to JPG", i: "📷", d: "Save every page as an image (ZIP)", acc: ".pdf", opts: sel("sc", "Quality", [[2, "High (2x)"], [1.5, "Medium"], [1, "Small"]]), async run(fs) { const r = await render(fs[0], +v("sc"), .92), z = new JSZip(); r.forEach((x, i) => z.file(`page-${i + 1}.jpg`, x.b)); return ["pages-jpg.zip", await z.generateAsync({ type: "uint8array" })] } },
      shrink: {
        n: "Compress PDF", i: "📉", d: "Reduce file size (best for scans)", acc: ".pdf", opts: sel("lv", "Compression", [["1.5,.7", "Light"], ["1.1,.55", "Recommended"], ["0.8,.4", "Extreme"]]) + `<div style="font-size:13px;color:var(--mut)">Note: pages become images, so text will no longer be selectable.</div>`, async run(fs) {
          const [sc, q] = v("lv").split(",").map(Number), r = await render(fs[0], sc, q), o = await PDFDocument.create();
          for (const x of r) { const im = await o.embedJpg(await x.b.arrayBuffer()); o.addPage([x.w, x.h]).drawImage(im, { x: 0, y: 0, width: x.w, height: x.h }) } return ["compressed.pdf", await o.save()]
        }
      }
    };
    let cur = null, files = [];
    let SEC = "pdf";
    function setSec(x) { SEC = x; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.id == "t_" + x)); home() }
    function home() { cur = null; files = []; const P = SEC == "pdf"; $("#app").innerHTML = `<h1>${P ? "Every PDF tool you need." : "Every image tool you need."} <span style="color:var(--ac)">Free.</span></h1><p class="sub">No sign-up, no limits, no watermarks. Everything runs privately in your browser.</p><div class="grid">${Object.entries(TOOLS).filter(([k, t]) => (t.sec || "pdf") == SEC).map(([k, t]) => `<div class="tool" onclick="open_('${k}')"><div class="i">${t.i}</div><h3>${t.n}</h3><p>${t.d}</p></div>`).join("")}</div>` }
    function open_(k) {
      cur = k; files = []; const t = TOOLS[k]; if (t.custom) return t.custom == 2 ? imgEditor() : editor(); $("#app").innerHTML = `<div class="panel"><button class="back" onclick="home()">← All tools</button><h2 style="margin:0 0 14px">${t.i} ${t.n}</h2>
<div class="drop" id="dz">Click to choose ${t.multi ? "files" : "a file"} or drop here<input type="file" id="fi" hidden accept="${t.acc}" ${t.multi ? "multiple" : ""}></div>
<ul class="files" id="fl"></ul><div class="opts">${t.opts || ""}</div><button class="btn" id="go" disabled>${t.n}</button><div id="out"></div></div>`;
      const dz = $("#dz"), fi = $("#fi"); dz.onclick = () => fi.click(); fi.onchange = () => add(fi.files);
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("over") }; dz.ondragleave = () => dz.classList.remove("over"); dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); add(e.dataTransfer.files) };
      $("#go").onclick = run
    }
    function add(l) { const t = TOOLS[cur]; files = t.multi ? files.concat([...l]) : [l[0]]; list() }
    function list() { const t = TOOLS[cur]; $("#fl").innerHTML = files.map((f, i) => `<li><span class="n">📄 ${f.name}</span><span style="color:var(--mut)">${kb(f.size)}</span>${t.multi ? `<button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button>` : ""}<button onclick="files.splice(${i},1);list()">✕</button></li>`).join(""); $("#go").disabled = files.length < (t.min || 1) }

    async function run() {
      const t = TOOLS[cur], b = $("#go"), o = $("#out"); b.disabled = true; b.textContent = "Working…"; o.innerHTML = "";
      try {
        const [name, data] = await t.run(files), before = files.reduce((a, f) => a + f.size, 0);
        o.innerHTML = `<div class="msg ok">✅ Done! ${name} · ${kb(data.length)} <span style="color:var(--mut)">(input ${kb(before)})</span><br><br><button class="btn" id="dl">⬇ Download ${name}</button></div>`;
        $("#dl").onclick = async () => {
          const d = await claude.use("downloads"); if (!d) { o.insertAdjacentHTML("beforeend", `<div class="msg">Downloads aren't available in this view.</div>`); return }
          try { await d.save({ filename: name, data }) } catch (e) { if (e.code != "declined") o.insertAdjacentHTML("beforeend", `<div class="msg">Could not save: ${e.message}</div>`) }
        }
      }
      catch (e) { o.innerHTML = `<div class="msg">⚠️ ${e.message || e}</div>` }
      b.disabled = false; b.textContent = t.n
    }
    TOOLS = { edit: { n: "Edit PDF", i: "✏️", d: "Edit existing text (auto font match), add text, draw/sign, highlight, whiteout, redact", custom: 1 }, ...TOOLS };
    const FAM = ['Helvetica,Arial,sans-serif', '"Times New Roman",Times,serif', '"Courier New",monospace'];
    const SF = StandardFonts, FN = [[SF.Helvetica, SF.HelveticaBold, SF.HelveticaOblique, SF.HelveticaBoldOblique], [SF.TimesRoman, SF.TimesRomanBold, SF.TimesRomanItalic, SF.TimesRomanBoldItalic], [SF.Courier, SF.CourierBold, SF.CourierOblique, SF.CourierBoldOblique]];
    const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const hx = a => "#" + a.map(v => v.toString(16).padStart(2, "0")).join("");
    const hexc = c => { const n = parseInt(c.slice(1), 16); return rgb((n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255) };
